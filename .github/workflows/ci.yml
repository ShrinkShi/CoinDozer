name: Validate pull requests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gameplay regression suite
        run: |
          node --check src/main.js
          node --check src/triggers.js
          node tests/v0631_triggers.mjs
          node tests/v064_vehicle.mjs
          node tests/v065_cave.mjs
          node tests/v070_layout.mjs
          node tests/v071_playability.mjs
          node tests/v071_drive.mjs
          python tests/v0631_build.py
          node tests/v063_performance.mjs
          node tests/v062_mechanics.mjs
          node tests/v061_economy.mjs
          node tests/v06_progression.mjs
          node tests/v051_mechanics.mjs
          node tests/v041_controls.mjs
      - name: Rebuild offline distribution
        run: |
          python build.py
          node tests/v0632_bundle_syntax.mjs
          git diff --exit-code -- dist/index.html
          grep -q 'VIDEO REPLICA · 0.7.1' dist/index.html

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated CI browser tools
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install chromium
      - name: Build standalone game
        run: |
          python build.py
          node tests/v0632_bundle_syntax.mjs
      - name: Mobile Chromium entrance smoke
        run: python tests/v0632_mobile_start.py
      - name: Long map bridge and snow transition smoke
        run: python tests/v070_browser.py
      - name: v0.7.1 minimap and control integration
        run: python tests/v071_browser.py
